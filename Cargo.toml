[package]
name = "tonal"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Tonal: lightweight native music player for Windows"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "system_fonts"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

rodio = { version = "0.21.1", default-features = false, features = ["playback", "wav", "mp3", "flac", "vorbis"] }
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4", "mkv"] }
opus = "0.4.0"
url = "2.5.7"
tempfile = "3.23"
fastrand = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
sha1 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
rquickjs = { version = "0.14.0", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
wry = { version = "0.57.2", default-features = false, features = ["os-webview"] }
tao = { version = "0.37.2", default-features = false, features = ["rwh_06"] }
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"
souvlaki = { version = "0.9.3", default-features = false }
tray-icon = { version = "0.26.1", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Foundation"] }
windows-core = "0.62.2"

[target.'cfg(windows)'.dev-dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
windows = { version = "0.62.2", features = ["Media_Control", "Foundation_Collections"] }

[features]
ui-capture = []

[[example]]
name = "export_icon"
required-features = ["ui-capture"]

[[example]]
name = "media_probe"
required-features = ["ui-capture"]

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
